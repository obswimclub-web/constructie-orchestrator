name: BOOT Qualification Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orchestrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orchestrator
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Runtime identity
        run: |
          node --version
          pnpm --version

      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate Prisma schema
        run: pnpm --filter @co/persistence prisma:validate

      - name: Generate Prisma Client
        run: pnpm --filter @co/persistence prisma:generate

      - name: Apply canonical SQL migrations
        run: pnpm db:migrate:sql

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration + E2E tests
        run: pnpm test

      - name: PostgreSQL restart/resume proof
        run: pnpm test:restart:postgres

      - name: Build
        run: pnpm build

      - name: Architecture invariants
        run: pnpm arch:check
