name: QUAL-001 Lockfile Verification

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qual-001-lockfile-verification
  cancel-in-progress: false

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Lockfile Presence
        shell: bash
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::Lockfile missing! pnpm-lock.yaml must be committed."
            exit 1
          fi
          echo "Lockfile is present."
